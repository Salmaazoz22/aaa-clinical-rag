# Local Qdrant for development and for the local-vs-Qdrant equivalence check.
#
#   docker compose up -d          start Qdrant on :6333 (REST) / :6334 (gRPC)
#   docker compose down           stop it, keep the data volume
#   docker compose down -v        stop it and delete the collection data
#
# Only Qdrant is containerised. The pipeline, the evaluation and the retriever
# still run on the host, against the same frozen artifacts as before.
services:
  qdrant:
    # Pinned so a local run and a rebuilt CI run use the same engine version.
    image: qdrant/qdrant:v1.19.0
    container_name: aaa-clinical-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC API
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      # Optional local API key. Leave unset for an unauthenticated dev instance;
      # it is read from the environment / .env and never committed.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image has no curl/wget; Qdrant's own binary answers the check.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
